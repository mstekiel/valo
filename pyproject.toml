[project]
name = "valo"
version = "0.1.0"
description = "Interactive scientific 3D rendering engine: wgpu + glfw + Dear ImGui"
requires-python = ">=3.12"
dependencies = [
    "glfw>=2.11.0",
    "imgui-bundle>=1.92,<1.92.900",
    "numpy>=2.0",
    "pillow>=12.3.0",
    "rendercanvas>=2.7",
    "wgpu>=0.32,<0.33",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
valo-sculpt = "valo.tools.sculptor:main"
valo-config = "valo.config:main"
valo-studio = "valo.studio:main"

[tool.ruff]
line-length = 120
extend-exclude = ["examples/spinw_studio/lfo_spinw.py"]  # your physics script, not valo style

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D1"]  # D1: every public module, class and function has a docstring
ignore = ["D105", "D107"]  # magic methods and __init__ (the class docstring covers it)

[tool.ruff.lint.per-file-ignores]
"valo/meshes/library/*.py" = ["E501", "D103"]  # written by MeshSculptor from your sculpt file
"tests/*.py" = ["D103"]  # test names say what they check
"examples/**/test_*.py" = ["D103"]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
addopts = "--strict-markers -q"
markers = ["gpu: needs a GPU adapter (renders offscreen)"]

[tool.uv.sources]
spinwaves = { path = "C:/Users/stekiel.JCNSOPC-MICHAL.001/Documents/GitHub/spinwaves", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
spinw = [
    "lmfit>=1.3.4",
    "spinwaves",
]
